[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openvision"
version = "1.0.0"
description = "Self-hosted, privacy-first AI vision tool for CLI and agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "opencv-python>=5.0",
    "pillow>=11",
    "numpy>=2",
    "typer>=0.23",
    "rich>=13",
    "pydantic>=2",
    "httpx>=0.28",
    "pyyaml>=6",
    "nvidia-ml-py>=12",
    "imageio>=2.36",
    "scikit-learn>=1.9.0",
    "scipy>=1.13",
    "tqdm>=4.67",
    "click>=8",
    "yt-dlp>=2025",
    "sherpa-onnx>=1.13",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-mock>=3",
    "pytest-cov>=6",
]
diarize = [
    "pyannote-audio>=4.0.7",
    "torch",
    "torchaudio",
    "torchvision",
]
segment = [
    "ultralytics>=8",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
openvision = "cli.app:app"
ov = "cli.app:app"

[tool.setuptools.packages.find]
# "openvision*" is the public API package and MUST stay in this list. It was
# dropped here in 6c1c30e and re-added in 8889660; while it was missing the
# `openvision` console script died with "No module named 'openvision'" and the
# whole test suite still passed, because `pythonpath = ["."]` below puts the
# project root on sys.path and masks the broken editable finder. Changing this
# list requires a reinstall (`pip install -e . --no-deps`).
# tests/test_packaging.py fails if this entry is dropped without a reinstall.
include = ["openvision*", "cli*", "core*", "providers*", "storage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Kept for collection only. It also masks a broken editable install, so
# tests/test_packaging.py verifies the installed distribution from a cwd outside
# this project.
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "video: marks tests that require a real video file",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
